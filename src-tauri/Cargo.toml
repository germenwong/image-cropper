[package]
name = "image-cropper"
version = "1.0.0"
description = "一键批量图片裁切工具"
authors = ["you"]
edition = "2021"

[lib]
name = "image_cropper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
rayon = "1.10"
base64 = "0.22"
walkdir = "2"
rand = "0.8"


[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
